<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Life Tracker - Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">🛡️ RPG Cloud Tracker</h1>
            <div class="text-right">
                <span class="text-xs text-slate-400 block">Status chmury:</span>
                <span id="sync-status" class="text-xs font-semibold text-amber-400">Gotowy</span>
            </div>
        </div>

        <!-- Identyfikator profilu -->
        <div class="mb-6 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
            <label class="block text-xs font-medium text-slate-300 mb-1">Identyfikator Profilu (wpisz np. <b>poszuu-rpg-2026</b>):</label>
            <div class="flex gap-2">
                <input type="text" id="profile-id" placeholder="np. poszuu-rpg-2026" class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm w-full focus:outline-none focus:border-indigo-500">
                <button onclick="loadFromCloud()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition whitespace-nowrap">Pobierz</button>
            </div>
        </div>

        <!-- Statysty -->
        <div class="bg-slate-900 p-4 rounded-xl mb-6 border border-slate-700">
            <div class="flex justify-between items-center mb-2">
                <span id="char-level" class="font-bold text-lg text-amber-400">Poziom 1</span>
                <span id="char-gold" class="text-yellow-400 font-semibold">🪙 0 Złota</span>
            </div>
            
            <div class="mb-2">
                <div class="flex justify-between text-xs text-slate-400 mb-1">
                    <span>HP (Zdrowie)</span>
                    <span id="hp-text">100/100</span>
                </div>
                <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                    <div id="hp-bar" class="bg-red-500 h-full transition-all duration-300" style="width: 100%"></div>
                </div>
            </div>

            <div>
                <div class="flex justify-between text-xs text-slate-400 mb-1">
                    <span>Doświadczenie (XP)</span>
                    <span id="xp-text">0/100</span>
                </div>
                <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                    <div id="xp-bar" class="bg-indigo-500 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Zadania -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-semibold text-sm text-slate-300">Zadania</h2>
                <button onclick="addTask()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1 rounded-md transition">+ Dodaj</button>
            </div>
            <div id="tasks-container" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
        </div>

        <div class="flex gap-2">
            <button onclick="saveToCloud()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-sm font-semibold transition shadow-lg">Zapisz do Chmury</button>
            <button onclick="loadFromCloud()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl text-sm font-semibold transition">Odśwież z Chmury</button>
        </div>
    </div>

    <script>
        // Publiczny, darmowy magazyn danych KVdb (nie wymaga konta i obsługuje CORS)
        const BUCKET_URL = "https://kvdb.io/A2b4C6d8E0f2G4h6J8k0L2";

        let gameState = {
            level: 1, hp: 100, maxHp: 100, xp: 0, maxXp: 100, gold: 0,
            tasks: [
                { id: 1, text: "Trening siłowy", reward: 20, done: false },
                { id: 2, text: "Nauka języka", reward: 15, done: false }
            ]
        };

        let savedId = localStorage.getItem('rpg_cloud_id') || '';
        if(savedId) {
            document.getElementById('profile-id').value = savedId;
        }

        function setStatus(text, colorClass) {
            const el = document.getElementById('sync-status');
            el.innerText = text;
            el.className = "text-xs font-semibold " + colorClass;
        }

        function render() {
            document.getElementById('char-level').innerText = `Poziom ${gameState.level}`;
            document.getElementById('char-gold').innerText = `🪙 ${gameState.gold} Złota`;
            document.getElementById('hp-text').innerText = `${gameState.hp}/${gameState.maxHp}`;
            document.getElementById('hp-bar').style.width = `${(gameState.hp / gameState.maxHp) * 100}%`;
            document.getElementById('xp-text').innerText = `${gameState.xp}/${gameState.maxXp}`;
            document.getElementById('xp-bar').style.width = `${(gameState.xp / gameState.maxXp) * 100}%`;

            const container = document.getElementById('tasks-container');
            container.innerHTML = '';
            
            gameState.tasks.forEach((task, index) => {
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-900 p-2.5 rounded-xl border border-slate-700/50">
                        <label class="flex items-center gap-2 cursor-pointer text-sm ${task.done ? 'line-through text-slate-500' : 'text-slate-200'}">
                            <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${index})" class="rounded bg-slate-800 border-slate-600 text-indigo-600">
                            ${task.text}
                        </label>
                        <span class="text-xs text-amber-400 font-medium">+${task.reward} XP</span>
                    </div>
                `;
            });
        }

        function toggleTask(index) {
            const task = gameState.tasks[index];
            task.done = !task.done;
            if (task.done) {
                gameState.xp += task.reward;
                gameState.gold += 10;
                if (gameState.xp >= gameState.maxXp) {
                    gameState.level++;
                    gameState.xp -= gameState.maxXp;
                    gameState.maxXp = Math.floor(gameState.maxXp * 1.2);
                    alert("🎉 Awans na wyższy poziom!");
                }
            } else {
                gameState.xp -= task.reward;
                if(gameState.xp < 0) gameState.xp = 0;
            }
            render();
            saveToCloud();
        }

        function addTask() {
            const text = prompt("Treść nowego zadania:");
            if(text) {
                gameState.tasks.push({ id: Date.now(), text: text, reward: 25, done: false });
                render();
                saveToCloud();
            }
        }

        function cleanId(raw) {
            return raw.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '');
        }

        async function saveToCloud() {
            const id = cleanId(document.getElementById('profile-id').value);
            if(!id) {
                alert("Wpisz najpierw Identyfikator Profilu (tylko litery i cyfry)!");
                return;
            }
            document.getElementById('profile-id').value = id;
            localStorage.setItem('rpg_cloud_id', id);
            setStatus("Wysyłanie do chmury...", "text-amber-400");

            try {
                const res = await fetch(`${BUCKET_URL}/rpg_${id}`, {
                    method: 'POST',
                    body: JSON.stringify(gameState)
                });
                if (!res.ok) throw new Error("Błąd serwera: " + res.status);
                setStatus("Zapisano w chmurze ✅", "text-emerald-400");
            } catch(err) {
                setStatus("Błąd połączenia ❌", "text-red-400");
                console.error(err);
            }
        }

        async function loadFromCloud() {
            const id = cleanId(document.getElementById('profile-id').value);
            if(!id) {
                alert("Wpisz Identyfikator Profilu!");
                return;
            }
            document.getElementById('profile-id').value = id;
            localStorage.setItem('rpg_cloud_id', id);
            setStatus("Pobieranie z chmury...", "text-amber-400");

            try {
                // Dodajemy ?t=... aby przeglądarka na telefonie nie brała starej wersji z pamięci podręcznej
                const res = await fetch(`${BUCKET_URL}/rpg_${id}?t=${Date.now()}`);
                if(res.status === 404) {
                    setStatus("Nowy profil (kliknij Zapisz)", "text-amber-400");
                    return;
                }
                if(!res.ok) throw new Error("Błąd: " + res.status);
                
                const data = await res.json();
                if(data && typeof data.level === 'number') {
                    gameState = data;
                    render();
                    setStatus("Zsynchronizowano ✅", "text-emerald-400");
                }
            } catch(err) {
                setStatus("Błąd pobierania ❌", "text-red-400");
                console.error(err);
            }
        }

        if(savedId) {
            loadFromCloud();
        } else {
            render();
        }
    </script>
</body>
</html>
