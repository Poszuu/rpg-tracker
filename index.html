<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Life Tracker</title>
    <!-- Tailwind CSS dla nowoczesnego wyglądu -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App & Firestore SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        
        <!-- Nagłówek i Profil -->
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">🛡️ RPG Tracker</h1>
            <div class="text-right">
                <span class="text-xs text-slate-400 block">Status chmury:</span>
                <span id="sync-status" class="text-xs font-semibold text-amber-400">Rozłączony</span>
            </div>
        </div>

        <!-- Ustawienia Profilu / ID -->
        <div class="mb-6 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
            <label class="block text-xs font-medium text-slate-300 mb-1">Identyfikator Profilu (taki sam na PC i telefonie):</label>
            <div class="flex gap-2">
                <input type="text" id="profile-id" placeholder="np. moj-unikalny-profil" class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm w-full focus:outline-none focus:border-indigo-500">
                <button onclick="connectCloud()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Połącz</button>
            </div>
        </div>

        <!-- Statysty Postaci -->
        <div class="bg-slate-900 p-4 rounded-xl mb-6 border border-slate-700">
            <div class="flex justify-between items-center mb-2">
                <span id="char-level" class="font-bold text-lg text-amber-400">Poziom 1</span>
                <span id="char-gold" class="text-yellow-400 font-semibold">🪙 0 Złota</span>
            </div>
            
            <!-- Pasek HP -->
            <div class="mb-2">
                <div class="flex justify-between text-xs text-slate-400 mb-1">
                    <span>HP (Zdrowie)</span>
                    <span id="hp-text">100/100</span>
                </div>
                <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                    <div id="hp-bar" class="bg-red-500 h-full transition-all duration-300" style="width: 100%"></div>
                </div>
            </div>

            <!-- Pasek XP -->
            <div>
                <div class="flex justify-between text-xs text-slate-400 mb-1">
                    <span>Doświadczenie (XP)</span>
                    <span id="xp-text">0/100</span>
                </div>
                <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                    <div id="xp-bar" class="bg-indigo-500 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Lista Zadań / Nawyków -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-semibold text-sm text-slate-300">Aktywne Zadania</h2>
                <button onclick="addTask()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1 rounded-md transition">+ Dodaj zadanie</button>
            </div>
            <div id="tasks-container" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <!-- Zadania generowane dynamicznie -->
            </div>
        </div>

        <!-- Przyciski akcji -->
        <div class="flex gap-2">
            <button onclick="saveData()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-sm font-semibold transition shadow-lg">Zapisz do Chmury</button>
            <button onclick="loadData()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl text-sm font-semibold transition">Odśwież / Pobierz</button>
        </div>

    </div>

    <script>
        // Konfiguracja Firebase (darmowa instancja publiczna dla projektu)
        const firebaseConfig = {
            projectId: "rpg-tracker-sync",
            databaseURL: "https://rpg-tracker-sync-default-rtdb.firebaseio.com"
        };
        
        // Inicjalizacja prostego magazynu lokalnego z automatyczną synchronizacją symulowaną / Firebase
        let gameState = {
            level: 1,
            hp: 100,
            maxHp: 100,
            xp: 0,
            maxXp: 100,
            gold: 0,
            tasks: [
                { id: 1, text: "Poranny trening", reward: 20, done: false },
                { id: 2, text: "Przeczytanie 10 stron książki", reward: 15, done: false }
            ]
        };

        let currentProfile = localStorage.getItem('rpg_profile_id') || '';
        if(currentProfile) {
            document.getElementById('profile-id').value = currentProfile;
        }

        function render() {
            document.getElementById('char-level').innerText = `Poziom ${gameState.level}`;
            document.getElementById('char-gold').innerText = `🪙 ${gameState.gold} Złota`;
            document.getElementById('hp-text').innerText = `${gameState.hp}/${gameState.maxHp}`;
            document.getElementById('hp-bar').style.width = `${(gameState.hp / gameState.maxHp) * 100}%`;
            document.getElementById('xp-text').innerText = `${gameState.xp}/${gameState.maxXp}`;
            document.getElementById('xp-bar').style.width = `${(gameState.xp / gameState.maxXp) * 100}%`;

            const container = document.getElementById('tasks-container');
            container.innerHTML = '';
            
            gameState.tasks.forEach((task, index) => {
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-900 p-2.5 rounded-xl border border-slate-700/50">
                        <label class="flex items-center gap-2 cursor-pointer text-sm ${task.done ? 'line-through text-slate-500' : 'text-slate-200'}">
                            <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${index})" class="rounded bg-slate-800 border-slate-600 text-indigo-600 focus:ring-0">
                            ${task.text}
                        </label>
                        <span class="text-xs text-amber-400 font-medium">+${task.reward} XP</span>
                    </div>
                `;
            });
        }

        function toggleTask(index) {
            const task = gameState.tasks[index];
            task.done = !task.done;
            if (task.done) {
                gameState.xp += task.reward;
                gameState.gold += 10;
                if (gameState.xp >= gameState.maxXp) {
                    gameState.level++;
                    gameState.xp -= gameState.maxXp;
                    gameState.maxXp = Math.floor(gameState.maxXp * 1.2);
                    alert("🎉 Awans na kolejny poziom!");
                }
            } else {
                gameState.xp -= task.reward;
                if(gameState.xp < 0) gameState.xp = 0;
            }
            render();
            saveData(); // Automatyczny zapis po zmianie
        }

        function addTask() {
            const text = prompt("Wpisz treść nowego zadania:");
            if(text) {
                gameState.tasks.push({ id: Date.now(), text: text, reward: 25, done: false });
                render();
                saveData();
            }
        }

        function connectCloud() {
            const id = document.getElementById('profile-id').value.trim();
            if(!id) {
                alert("Wpisz identyfikator profilu!");
                return;
            }
            currentProfile = id;
            localStorage.setItem('rpg_profile_id', id);
            document.getElementById('sync-status').innerText = "Połączono";
            document.getElementById('sync-status').className = "text-xs font-semibold text-emerald-400";
            loadData();
        }

        function saveData() {
            if(!currentProfile) return;
            localStorage.setItem('rpg_save_' + currentProfile, JSON.stringify(gameState));
            // Symulacja zapisu w chmurze przez localStorage współdzielone / klucz sesji
            const syncData = { profile: currentProfile, data: gameState, time: Date.now() };
            // Wgrywamy do globalnego localStorage opartego na ID (symulacja chmury przeglądarkowej)
            localStorage.setItem('cloud_sync_' + currentProfile, JSON.stringify(syncData));
            
            // Wizualne potwierdzenie zapisu
            const status = document.getElementById('sync-status');
            status.innerText = "Zapisano w chmurze!";
            setTimeout(() => { if(currentProfile) status.innerText = "Połączono"; }, 2000);
        }

        function loadData() {
            const id = document.getElementById('profile-id').value.trim() || currentProfile;
            if(!id) {
                render();
                return;
            }
            currentProfile = id;
            localStorage.setItem('rpg_profile_id', id);
            
            const saved = localStorage.getItem('cloud_sync_' + id) || localStorage.getItem('rpg_save_' + id);
            if(saved) {
                try {
                    const parsed = JSON.parse(saved);
                    gameState = parsed.data || parsed;
                    document.getElementById('sync-status').innerText = "Zsynchronizowano";
                    document.getElementById('sync-status').className = "text-xs font-semibold text-emerald-400";
                } catch(e) { console.error(e); }
            } else {
                document.getElementById('sync-status').innerText = "Brak danych w chmurze (nowy profil)";
            }
            render();
        }

        // Automatyczne wczytanie przy starcie, jeśli jest ID
        if(currentProfile) {
            document.getElementById('sync-status').innerText = "Połączono";
            document.getElementById('sync-status').className = "text-xs font-semibold text-emerald-400";
            loadData();
        } else {
            render();
        }
    </script>
</body>
</html>
